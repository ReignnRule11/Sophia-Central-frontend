name: Generate Sophis PWA icons

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/sophia-central-mark.png"
      - "scripts/generate-pwa-icons.py"
      - ".github/workflows/generate-pwa-icons.yml"

permissions:
  contents: write

concurrency:
  group: sophis-pwa-icons
  cancel-in-progress: false

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate PNG and ICO variants
        run: python scripts/generate-pwa-icons.py

      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apple-touch-icon.png public/sophis-central-favicon.png public/sophis-central-favicon-32.png public/sophis-central-favicon-48.png public/sophis-central-favicon.ico public/sophis-central-192.png public/sophis-central-512.png public/sophis-central-maskable-512.png
          if git diff --cached --quiet; then
            echo "Generated icon assets are already up to date."
            exit 0
          fi
          git commit -m "Generate white-background Sophis PWA icon assets"
          git push origin "HEAD:${{ github.ref_name }}"
