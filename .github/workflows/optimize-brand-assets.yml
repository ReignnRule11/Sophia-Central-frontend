name: Optimize brand and homepage images

on:
  push:
    branches:
      - perf/optimize-brand-and-homepage-images
    paths:
      - 'scripts/optimize-brand-assets.mjs'
      - '.github/workflows/optimize-brand-assets.yml'

permissions:
  contents: write

jobs:
  optimize-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image optimizer
        run: npm install --no-save --package-lock=false sharp
      - name: Resize and compress image assets
        run: node scripts/optimize-brand-assets.mjs
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/sophia-central-logo.png public/sophia-central-mark.png public/images/
          if git diff --cached --quiet; then
            echo "No optimized image changes to commit."
          else
            git commit -m "Optimize brand and homepage image assets"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi
